services:
  dm_postgres:
    image: postgres:18
    container_name: cgdm-postgres
    restart: always
    ports:
      - "26432:5432"
    volumes:
      - cgdm_postgres_data:/var/lib/postgresql
    environment:
      POSTGRES_DB: cdmgr
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123456"
      TZ: Asia/Shanghai

  dm_console:
    image: __IMAGE_PREFIX__-console:__IMAGE_TAG__
    container_name: cgdm-console
    restart: always
    ports:
      - "8222:8222"
      - "8008:8008"
    depends_on:
      - dm_postgres
    volumes:
      - cgdm_console_conf:/root/cgdm/console/conf
      - cgdm_console_logs:/root/cgdm/console/logs
      - cgdm_console_data:/root/cgdm/console/data
    environment:
      APP_WEB_PORT: 8222
      APP_SERVE_NAME: dm_console
      APP_SERVE_PORT: 8008
      # Override image defaults with packaged PostgreSQL 18+ deployment values.
      DB_TYPE: postgresql
      DB_HOST: dm_postgres
      DB_PORT: 5432
      DB_DATABASE: cdmgr
      DB_USERNAME: postgres
      DB_PASSWORD: "123456"

  dm_sidecar:
    image: __IMAGE_PREFIX__-sidecar:__IMAGE_TAG__
    container_name: cgdm-sidecar
    restart: always
    depends_on:
      - dm_console
    volumes:
      - cgdm_sidecar_0_conf:/root/cgdm/sidecar/conf
      - cgdm_sidecar_0_logs:/root/cgdm/sidecar/logs
      - cgdm_sidecar_0_data:/root/cgdm/sidecar/data
    environment:
      APP_WEB_PORT: 8080
      DM_CLIENT_AK: "ak0a2c62tdo1ap2416655mpyx0v36l359p1v5rn782caw8t0qkk1s94b80lfs90"
      DM_CLIENT_SK: "sk6206iy4pb0eydz9hg97jo3tu5d80j97e91bbql65167u8wb75x4ej6e4v4aa4"
      DM_CLIENT_WSN: "wsn582nm54ca045p014288w6e919ec6294m430h427619v64g0pyqzcjb5040q3f"
      APP_SERVE_NAME: dm_console
      APP_SERVE_PORT: 8008

volumes:
  cgdm_console_conf:
  cgdm_console_logs:
  cgdm_console_data:
  cgdm_sidecar_0_conf:
  cgdm_sidecar_0_logs:
  cgdm_sidecar_0_data:
  cgdm_postgres_data:
